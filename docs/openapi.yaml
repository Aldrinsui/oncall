      properties:
        id:
          type: string
          format: uuid
        is_agent:
          type: boolean
        agent_id:
          type: [string, "null"]
          format: uuid
        name:
          type: string
        role:
          type: string
        email_or_channel:
          type: string
        status:
          type: string
          enum: [INVITED, ACCEPTED, DECLINED, TENTATIVE]

    CalendarEventDTO:
      type: object
      required: [id, organizer_id, title, session_slug, starts_at, ends_at, is_all_day, participants]
      properties:
        id:
          type: string
          format: uuid
        organizer_id:
          type: string
          format: uuid
        title:
          type: string
        location:
          type: [string, "null"]
        session_slug:
          type: string
        meta:
          type: [string, "null"]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_all_day:
          type: boolean
        participants:
          type: array
          items:
            $ref: '#/components/schemas/CalendarParticipantDTO'

    CalendarEventResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CalendarEventDTO'
        meta:
          $ref: '#/components/schemas/MetaEnvelope'

    CalendarEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEventDTO'
        meta:
          $ref: '#/components/schemas/MetaEnvelope'

    CreateCalendarEventRequest:
      type: object
      required: [title, starts_at, ends_at]
      properties:
        title:
          type: string
        location:
          type: [string, "null"]
        meta:
          type: [string, "null"]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        is_all_day:
          type: boolean
          default: false

    UpdateCalendarEventRequest:
      type: object
      properties:
        title:
          type: string
        location:
          type: [string, "null"]
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time

    InviteCollaboratorItem:
      type: object
      required: [name, role, email_or_channel, is_agent]
      properties:
        name:
          type: string
        role:
          type: string
        email_or_channel:
          type: string
        is_agent:
          type: boolean
        agent_id:
          type: [string, "null"]
          format: uuid

    InviteCollaboratorsRequest:
      type: object
      required: [collaborators]
      properties:
        collaborators:
          type: array
          items:
            $ref: '#/components/schemas/InviteCollaboratorItem'

    # --- Pulse DTOs ---
    PulseChannelDTO:
      type: object
      required: [id, name, store, description, icon, color, unread_count]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        store:
          type: string
        description:
          type: [string, "null"]
        icon:
          type: string
        color:
          type: string
        unread_count:
          type: integer

    PulseChannelListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PulseChannelDTO'
        meta:
          $ref: '#/components/schemas/MetaEnvelope'

    PulseMessageDTO:
      type: object
      required: [id, channel_id, sender_id, sender_name, sender_initials, body, sent_at, is_current_agent]
      properties:
        id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        sender_name:
          type: string
        sender_initials:
          type: string
        body:
          type: string
        sent_at:
          type: string
          format: date-time
        is_current_agent:
          type: boolean

    PulseMessageListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PulseMessageDTO'
        meta:
